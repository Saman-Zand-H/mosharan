[project]
name = "device-events-api"
version = "0.1.0"
description = "Backend for receiving microcontroller events"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Django==5.2.17",
    "django-ninja==1.6.2",
]

[dependency-groups]
dev = [
    "django-stubs==5.2.9",
    "pyrefly==1.2.0",
    "ruff==0.16.3",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyrefly]
python-version = "3.10"
